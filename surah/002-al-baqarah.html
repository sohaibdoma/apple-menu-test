  <main class="surah">
    <h1 class="surah-title">سورة البقرة</h1>

    <p class="ayah">الم</p>
    <p class="ayah">ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ</p>
    <p class="ayah">
      الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ
      وَيُقِيمُونَ الصَّلَاةَ
      وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ
    </p>
