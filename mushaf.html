<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mushaf</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root data-surah="1" data-page-type="mushaf">

  <header class="main-header">

    <div class="header-bar">

      <div class="header-controls">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

<a href="index.html" class="home-toggle" aria-label="Home">
  <svg class="home-icon" viewBox="0 0 30 29" aria-hidden="true">
    <defs>
      <mask id="homeCutoutMask">
        <rect width="30" height="29" fill="white" />

        <path
          fill="black"
          transform="translate(15 14.5) scale(1.3) translate(-15 -13.8)"
          d="
            M10.25 9.95
            L13.2 7.72
            C14.25 6.92 15.75 6.92 16.8 7.72
            L19.75 9.95
            C20.57 10.57 21.04 11.55 21.04 12.58
            V17.94
            C21.04 19.11 20.09 20.06 18.92 20.06
            H17.14
            V16.36
            A2.14 2.14 0 0 0 12.86 16.36
            V20.06
            H11.08
            C9.91 20.06 8.96 19.11 8.96 17.94
            V12.58
            C8.96 11.55 9.43 10.57 10.25 9.95
            Z
          "
        />
      </mask>
    </defs>

    <path
      fill="currentColor"
      mask="url(#homeCutoutMask)"
      d="
        M11 0.5
        H19
        C25.3513 0.5 29.5 4.64873 29.5 11
        V18
        C29.5 24.3513 25.3513 28.5 19 28.5
        H11
        C4.64873 28.5 0.5 24.3513 0.5 18
        V11
        C0.5 4.64873 4.64873 0.5 11 0.5
        Z
      "
    />
  </svg>
</a>
      </div>

      <div id="nav-surah-title" class="nav-surah-title"></div>

      <div class="header-left">
        <div class="lang-switch">
          <button data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
          <button data-lang="tr">TR</button>
        </div>
      </div>

      <div class="header-right">
        <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2 L20 20"></path>
          </svg>
        </button>

        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
            <path class="arm" pathLength="100" d="M6 8 L18 20" />
            <path class="arm" pathLength="100" d="M18 8 L6 20" />
          </svg>
        </button>
      </div>

    </div>

    <div id="menu-placeholder"></div>
    <div id="search-placeholder"></div>

  </header>

  <main class="mushaf-container">
    <div id="mushaf-top-spacer"></div>
    <div id="mushaf-pages"></div>
    <div id="mushaf-bottom-spacer"></div>
  </main>

<div class="surah-bottom-controls">
  <div class="auto-scroll-bar">
    <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
      <svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect class="auto-dot" x="10.7" y="5.2" width="2.6" height="2.6" rx="1.3" fill="currentColor" />
        <path class="auto-chev auto-thin" d="M8.25 10 L12 13 L15.75 10" />
        <path class="auto-chev auto-mid" d="M7 15 L12 19 L17 15" />
      </svg>
    </button>
  </div>

  <a id="mushafNextSurahBtn" class="surah-bottom-pill mushaf-next-surah-btn" href="#" aria-label="Next Surah">
    <span id="mushafNextSurahName"></span>
    <span class="mushaf-next-surah-arrow" aria-hidden="true">←</span>
  </a>
</div>
  
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mushaf.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="script.js"></script>

</body>
</html>
