<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mushaf</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root data-surah="1" data-page-type="mushaf">

  <header class="main-header">

    <div class="header-bar">

      <div class="header-controls">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="theme-icon" viewBox="0 0 30 29" aria-hidden="true">
    <circle class="theme-sun-center" cx="15" cy="14.5" r="5" />

    <g class="theme-ray theme-ray--top" transform="translate(15 5.2)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-right" transform="translate(21.6 7.9) rotate(45)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--right" transform="translate(24.3 14.5) rotate(90)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-right" transform="translate(21.6 21.1) rotate(135)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom" transform="translate(15 23.8) rotate(180)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-left" transform="translate(8.4 21.1) rotate(225)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--left" transform="translate(5.7 14.5) rotate(270)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-left" transform="translate(8.4 7.9) rotate(315)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>
  </svg>
</button>


      </div>

      <div id="nav-surah-title" class="nav-surah-title"></div>

      <div class="header-left">
        <div class="lang-switch">
          <button data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
          <button data-lang="tr">TR</button>
        </div>
      </div>

      <div class="header-right">
        <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2 L20 20"></path>
          </svg>
        </button>

        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
            <path class="arm" pathLength="100" d="M6 8 L18 20" />
            <path class="arm" pathLength="100" d="M18 8 L6 20" />
          </svg>
        </button>
      </div>

    </div>

    <div id="menu-placeholder"></div>
    <div id="search-placeholder"></div>

  </header>

  <main class="mushaf-container">
    <div id="mushaf-top-spacer"></div>
    <div id="mushaf-pages"></div>
    <div id="mushaf-bottom-spacer"></div>
  </main>

<div class="surah-bottom-controls">
  <div class="auto-scroll-bar">
    <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
      <svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect class="auto-dot" x="10.7" y="5.2" width="2.6" height="2.6" rx="1.3" fill="currentColor" />
        <path class="auto-chev auto-thin" d="M8.25 10 L12 13 L15.75 10" />
        <path class="auto-chev auto-mid" d="M7 15 L12 19 L17 15" />
      </svg>
    </button>
  </div>

  
<div class="mushaf-bottom-right">

  
<div class="font-size-pill" id="fontSizePill" aria-label="Quran font size">
  <button
    id="fontSizeTrigger"
    class="font-size-trigger"
    type="button"
    aria-label="Open font size menu"
    aria-expanded="false"
  >
  <span class="font-size-trigger-large">ء</span>

    
    <svg class="font-size-close-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 8 L18 20" />
    <path d="M18 8 L6 20" />
  </svg>

    
</button>

  <div class="font-size-menu" aria-label="Choose Quran font size">
    <button class="font-size-btn font-size-btn--xs" type="button" data-font-size-option="xsmall">ء</button>
    <button class="font-size-btn font-size-btn--sm" type="button" data-font-size-option="small">ء</button>
    <button class="font-size-btn font-size-btn--md is-active" type="button" data-font-size-option="normal">ء</button>
    <button class="font-size-btn font-size-btn--lg" type="button" data-font-size-option="large">ء</button>
    <button class="font-size-btn font-size-btn--xl" type="button" data-font-size-option="xlarge">ء</button>
  </div>
</div>

  

<div class="mushaf-surah-pill" id="mushafSurahPill">
  <a
    id="mushafNextSurahBtn"
    class="surah-bottom-pill mushaf-next-surah-btn"
    href="javascript:void(0)"
    aria-expanded="false"
  >

    
<span class="fihris-icon" aria-hidden="true">
  <svg class="fihris-chevron-svg" viewBox="0 0 40 16">
    <path d="M2 11 L20 1 L38 11">
      <animate
        id="fihrisChevronOpen"
        attributeName="d"
        begin="indefinite"
        dur="800ms"
        fill="freeze"
        calcMode="spline"
        keyTimes="0;1"
        keySplines="0.22 1 0.36 1"
        from="M2 11 L20 1 L38 11"
        to="M2 1 L20 11 L38 1"
      />
      <animate
        id="fihrisChevronClose"
        attributeName="d"
        begin="indefinite"
        dur="800ms"
        fill="freeze"
        calcMode="spline"
        keyTimes="0;1"
        keySplines="0.22 1 0.36 1"
        from="M2 1 L20 11 L38 1"
        to="M2 11 L20 1 L38 11"
      />
    </path>
  </svg>
</span>


    

<span class="fihris-label">السور</span>
  </a>

  <div id="mushafSurahPicker" class="mushaf-surah-picker" aria-hidden="true">
    <div id="mushafSurahPickerList" class="mushaf-surah-picker-list"></div>
  </div>
</div>

</div>
</div>


  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mushaf.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="js/font-size-control.js"></script>
  <script src="script.js"></script>

</body>
</html>

<!-- rebuild trigger -->
