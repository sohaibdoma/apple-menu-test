<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wahyollah</title>
  
  <base href="/wahyollah/">
  
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
  
</head>
<body data-lang-root data-surah="0">

<!-- HEADER -->

  <header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    
   <div class="header-controls">
     <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

<a href="index.html" class="home-toggle" aria-label="Home">
  <svg class="home-icon" viewBox="0 0 30 29" aria-hidden="true">
<path
  fill="currentColor"
  fill-rule="evenodd"
  clip-rule="evenodd"
  transform="translate(15 14.5) scale(1.5) translate(-15 -14.5)"
  d="
    M11 0.5
    H19
    C25.3513 0.5 29.5 4.64873 29.5 11

    V11
    C0.5 4.64873 4.64873 0.5 11 0.5
    Z

    M10.25 8.75
    L13.2 6.52
    C14.25 5.72 15.75 5.72 16.8 6.52
    L19.75 8.75
    C20.57 9.37 21.04 10.35 21.04 11.38

  </svg>
</a>
   </div>

    
    <div class="header-left">
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">

     <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
       <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
         <circle cx="11" cy="11" r="6.5"></circle>
         <path d="M16.2 16.2 L20 20"></path>
       </svg>
     </button>
      
     <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>
    
  <div id="search-placeholder"></div>
    
</header>

  <!-- HOME CONTENT -->
<main class="home">
  <div class="home-actions">
    <button id="chooseSurahBtn" class="choose-surah-btn" type="button">
      القرآن الكريم
    </button>

    <button id="openSearchBtn" class="choose-surah-btn" type="button">
      البحث
    </button>

    <button id="mushafBtn" class="choose-surah-btn">
  المصحف
</button>
    
  </div>
</main>


  <footer class="home-footer">
  <div class="home-footer-inner">
    <p class="home-footer-brand">Wahyollah</p>
    <p class="home-footer-copy">© 2026 All rights reserved</p>
  </div>
</footer>
  

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
