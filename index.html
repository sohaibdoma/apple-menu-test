<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  
<title>Wahyollah</title>

<meta name="description" content="Read and explore the Holy Quran with Wahyollah." />

<link rel="canonical" href="https://wahyollah.com/" />
  
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
  
</head>
<body data-lang-root data-surah="0">

<!-- HEADER -->

  <header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    
   <div class="header-controls">
     



   <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="theme-icon" viewBox="0 0 30 29" aria-hidden="true">
    <circle class="theme-sun-center" cx="15" cy="14.5" r="5" />

    <g class="theme-ray theme-ray--top" transform="translate(15 5.2)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-right" transform="translate(21.6 7.9) rotate(45)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--right" transform="translate(24.3 14.5) rotate(90)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-right" transform="translate(21.6 21.1) rotate(135)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom" transform="translate(15 23.8) rotate(180)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-left" transform="translate(8.4 21.1) rotate(225)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--left" transform="translate(5.7 14.5) rotate(270)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-left" transform="translate(8.4 7.9) rotate(315)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>
  </svg>
</button>

     
   </div>

    
    <div class="header-left">
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">

     <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
       <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
         <circle cx="11" cy="11" r="6.5"></circle>
         <path d="M16.2 16.2 L20 20"></path>
       </svg>
     </button>
      
     <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>
    
  <div id="search-placeholder"></div>
    
</header>

  <!-- HOME CONTENT -->
<main class="home">
  <div class="home-actions">
    <button id="chooseSurahBtn" class="choose-surah-btn" type="button">
      إختر سورة
    </button>

    <button id="mushafBtn" class="choose-surah-btn" type="button">
   المصحف كامل
</button>
    
  </div>
</main>


<footer class="home-footer">
  <div class="home-footer-inner">

    <svg class="footer-logo" viewBox="0 0 997 913.63" aria-hidden="true">
      <path
        fill="currentColor"
        d="M539.93,738.58,346.43,545.09c-84.2-84.2-220.72-84.2-304.93,0h0L460.15,963.74a112.61,112.61,0,0,0,79.92,33.08h0a112.57,112.57,0,0,0,79.78-33.07L1038.5,545.09h0c-84.21-84.21-220.73-84.21-304.93,0L540,738.66"
        transform="translate(-41.5 -83.18)"
      />
      <path
        fill="currentColor"
        d="M539.93,567.88l.07.07,62.38-62.38A155.06,155.06,0,0,0,647.8,395.93V193.11c0-60.44-49.47-111.06-109.9-109.91A107.8,107.8,0,0,0,432.2,191v205a155.06,155.06,0,0,0,45.42,109.64Z"
        transform="translate(-41.5 -83.18)"
      />
    </svg>

  </div>
</footer>



  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
