<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wahyollah</title>
  
  <base href="/wahyollah/">
  
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
  
</head>
<body data-lang-root data-surah="0">

<!-- HEADER -->
<header class="main-header">

  <button id="themeToggle" class="theme-toggle"></button>

  <div class="header-left">
    <div class="lang-switch">
      <button data-lang="ar">AR</button>
      <button data-lang="en">EN</button>
      <button data-lang="tr">TR</button>
    </div>
  </div>

  <div class="header-right">
    <button class="menu-button" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
    </button>
  </div>

</header>
  
  <!-- SHARED MENU -->
  <div id="menu-placeholder"></div>

  <!-- HOME CONTENT -->
  <main class="home">
    <h1 class="home-title" data-i18n="home_title"></h1>
    <p class="home-subtitle" data-i18n="home_subtitle"></p>

    <div class="home-content">
  <h2>إختر سورة من القائمة</h2>

</div>

  </main>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
