<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  <header class="main-header">

    <!-- TOP BAR (controls only) -->
    <div class="header-bar">

      <div class="header-controls">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

<a href="index.html" class="home-toggle" aria-label="Home">
  <svg class="home-icon" viewBox="0 0 30 29" aria-hidden="true">
    <defs>
      <mask id="homeCutoutMask">
        <rect width="30" height="29" fill="white" />

        <path
          fill="black"
          transform="translate(15 14.5) scale(1.3) translate(-15 -13.8)"
          d="
            M10.25 9.95
            L13.2 7.72
            C14.25 6.92 15.75 6.92 16.8 7.72
            L19.75 9.95
            C20.57 10.57 21.04 11.55 21.04 12.58
            V17.94
            C21.04 19.11 20.09 20.06 18.92 20.06
            H17.14
            V16.36
            A2.14 2.14 0 0 0 12.86 16.36
            V20.06
            H11.08
            C9.91 20.06 8.96 19.11 8.96 17.94
            V12.58
            C8.96 11.55 9.43 10.57 10.25 9.95
            Z
          "
        />
      </mask>
    </defs>

    <path
      fill="currentColor"
      mask="url(#homeCutoutMask)"
      d="
        M11 0.5
        H19
        C25.3513 0.5 29.5 4.64873 29.5 11
        V18
        C29.5 24.3513 25.3513 28.5 19 28.5
        H11
        C4.64873 28.5 0.5 24.3513 0.5 18
        V11
        C0.5 4.64873 4.64873 0.5 11 0.5
        Z
      "
    />
  </svg>
</a>
      </div>

      <div class="header-left">
        <div class="lang-switch">
          <button data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
          <button data-lang="tr">TR</button>
        </div>
      </div>

      <div class="header-right">

        <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2 L20 20"></path>
          </svg>
        </button>

        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
            <path class="arm" pathLength="100" d="M6 8 L18 20" />
            <path class="arm" pathLength="100" d="M18 8 L6 20" />
          </svg>
        </button>
      </div>
    </div>

    <!-- MENU AREA -->
    <div id="menu-placeholder"></div>

    <div id="search-placeholder"></div>

  </header>

  <!-- SEARCH PAGE CONTENT -->
  <main class="search-page">
    
<div class="search-page-header">
  <h1 class="search-page-title" data-i18n="search_page_title"></h1>
  <p class="search-page-subtitle" id="search-page-query"></p>
</div>

<div class="search-page-input-wrap">
  <div class="search-input-wrap" dir="rtl">
    <input
      id="searchPageInput"
      class="search-input"
      type="search"
      autocomplete="off"
      spellcheck="false"
      data-i18n-placeholder="search_placeholder"
      data-i18n-aria-label="search_aria_label"
    />
    <button
      type="button"
      class="search-submit"
      id="searchPageSubmit"
      aria-label="Search"
      aria-disabled="true"
      disabled
    >
      <svg class="search-submit-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16.2 16.2 L20 20"></path>
      </svg>
    </button>
  </div>
</div>

<div id="search-page-results" class="search-page-results"></div>
    
  </main>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search-page.js"></script>
  <script src="script.js"></script>

</body>
</html>
