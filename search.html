<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  <header class="main-header">

    <!-- TOP BAR (controls only) -->
    <div class="header-bar">

      <div class="header-controls">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

<a href="index.html" class="home-toggle" aria-label="Home">
  <svg class="home-icon" viewBox="0 0 30 29" aria-hidden="true">
    <path
      fill="currentColor"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M11 0.5
        H19
        C25.3513 0.5 29.5 4.64873 29.5 11
        V18
        C29.5 24.3513 25.3513 28.5 19 28.5

        V11
        C0.5 4.64873 4.64873 0.5 11 0.5
        Z

        M15 6.2
        C14.62 6.2 14.26 6.33 13.95 6.57
        L8.95 10.42
        C8.53 10.74 8.29 11.24 8.29 11.78
        V19
        C8.29 19.61 8.78 20.1 9.39 20.1
        H12.45
        V16.6
        C12.45 15.89 13.02 15.32 13.73 15.32
        H16.27
        C16.98 15.32 17.55 15.89 17.55 16.6
        V20.1
        H20.61
        C21.22 20.1 21.71 19.61 21.71 19
        V11.78
        C21.71 11.24 21.47 10.74 21.05 10.42

        M14.2 20.1
        V17.07

        V20.1

      "
    />
  </svg>
</a>
      </div>

      <div class="header-left">
        <div class="lang-switch">
          <button data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
          <button data-lang="tr">TR</button>
        </div>
      </div>

      <div class="header-right">

        <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2 L20 20"></path>
          </svg>
        </button>

        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
            <path class="arm" pathLength="100" d="M6 8 L18 20" />
            <path class="arm" pathLength="100" d="M18 8 L6 20" />
          </svg>
        </button>
      </div>
    </div>

    <!-- MENU AREA -->
    <div id="menu-placeholder"></div>

    <div id="search-placeholder"></div>

  </header>

  <!-- SEARCH PAGE CONTENT -->
  <main class="search-page">
    
<div class="search-page-header">
  <h1 class="search-page-title" data-i18n="search_page_title"></h1>
  <p class="search-page-subtitle" id="search-page-query"></p>
</div>

<div class="search-page-input-wrap">
  <div class="search-input-wrap" dir="rtl">
    <input
      id="searchPageInput"
      class="search-input"
      type="search"
      autocomplete="off"
      spellcheck="false"
      data-i18n-placeholder="search_placeholder"
      data-i18n-aria-label="search_aria_label"
    />
    <button
      type="button"
      class="search-submit"
      id="searchPageSubmit"
      aria-label="Search"
      aria-disabled="true"
      disabled
    >
      <svg class="search-submit-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16.2 16.2 L20 20"></path>
      </svg>
    </button>
  </div>
</div>

<div id="search-page-results" class="search-page-results"></div>
    
  </main>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search-page.js"></script>
  <script src="script.js"></script>

</body>
</html>
