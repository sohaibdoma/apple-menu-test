<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surah</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  
<header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    <button id="themeToggle" class="theme-toggle"></button>

    <div class="header-left">
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">
     <button class="menu-toggle" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>

</header>
  
  <!-- SURAH CONTENT -->
  <main class="surah-container">
    <div id="surah-header"></div>
    <div id="surah-content"></div>
  </main>

  <div class="auto-scroll-bar" aria-hidden="false">
   <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
     <svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">

  <!-- Vertical line ABOVE the wings (static, never animates) -->
  <path class="auto-mid" d="M12 5.2 V8.4" />

  <!-- ================= TOP WINGS (thin) ================= -->

  <path class="auto-wing auto-thin" d="M8 10 L12 14">
    <animate id="topOpenLeft"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M7 12 H12" />
    <animate id="topCloseLeft"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M8 10 L12 14" />
  </path>

  <path class="auto-wing auto-thin" d="M16 10 L12 14">
    <animate id="topOpenRight"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M12 12 H17" />
    <animate id="topCloseRight"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M16 10 L12 14" />
  </path>

  <!-- ================= BOTTOM WINGS (thicker) ================= -->

  <path class="auto-wing auto-thick" d="M7 13.2 L12 18.2">
    <animate id="botOpenLeft"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M6 16 H12" />
    <animate id="botCloseLeft"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M7 13.2 L12 18.2" />
  </path>

  <path class="auto-wing auto-thick" d="M17 13.2 L12 18.2">
    <animate id="botOpenRight"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M12 16 H18" />
    <animate id="botCloseRight"
      attributeName="d"
      dur="700ms"
      fill="freeze"
      begin="indefinite"
      to="M17 13.2 L12 18.2" />
  </path>

</svg>
   </button>
  </div>
  
  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/surah-engine.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
