<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surah</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  
<header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    <button id="themeToggle" class="theme-toggle"></button>

    <div class="header-left">
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">
     <button class="menu-toggle" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>

</header>
  
  <!-- SURAH CONTENT -->
  <main class="surah-container">
    <div id="surah-header"></div>
    <div id="surah-content"></div>
  </main>

  <div class="auto-scroll-bar" aria-hidden="false">
   <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
     <svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">

       <!-- CHEVRON MODE (default) -->
       <g class="auto-shape auto-chev">
         <!-- Upper chevron (thin) -->
          <path class="auto-arm auto-thin" d="M7 6.3 L12 10.3" />
          <path class="auto-arm auto-thin" d="M17 6.3 L12 10.3" />

         <!-- Small middle dash (does NOT touch chevron) -->
         <path class="auto-mid" d="M12 8.2 V10.2" />

         <!-- Lower chevron (thicker + bigger under it) -->
         <g class="auto-big">
          <path class="auto-arm auto-thick" d="M6 11.7 L12 15.7" />
          <path class="auto-arm auto-thick" d="M18 11.7 L12 15.7" />
         </g>
       </g>

       <!-- LINE MODE (shown when ON) -->
       <g class="auto-shape auto-lines">
         <!-- Top line (thin) -->
         <path class="auto-line auto-thin" d="M7 10.5 H17" />
         <!-- Keep the same middle dash line -->
         <path class="auto-mid" d="M10.3 9.0 H13.7" />
         <!-- Bottom line (thicker) -->
         <path class="auto-line auto-thick" d="M6 14.5 H18" />
       </g>

     </svg>
   </button>
  </div>
  
  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/surah-engine.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
