<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surah</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  
<header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    <button id="themeToggle" class="theme-toggle"></button>

    <div class="header-left">
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">
     <button class="menu-toggle" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>

</header>
  
  <!-- SURAH CONTENT -->
  <main class="surah-container">
    <div id="surah-header"></div>
    <div id="surah-content"></div>
  </main>

  <div class="auto-scroll-bar" aria-hidden="false">
   <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
     
<svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">

  <!-- 1) Vertical stem -->
  <path class="auto-stem" d="M12 5.2 V11.2" />

  <!-- 2) One chevron attached to the stem end (touches at 12,11.2) -->
  <path class="auto-chev" d="M8.2 11.2 L12 15.0 L15.8 11.2">

    <!-- OPEN (flatten into a straight line) -->
<animate id="chevOpen"
  attributeName="d"
  dur="700ms"
  fill="freeze"
  begin="indefinite"
  to="M7.5 13.1 H16.5"
  calcMode="spline"
  keyTimes="0;1"
  keySplines="0.22 1 0.36 1" />

    <!-- CLOSE (back to chevron) -->
<animate id="chevClose"
  attributeName="d"
  dur="700ms"
  fill="freeze"
  begin="indefinite"
  to="M8.2 11.2 L12 15.0 L15.8 11.2"
  calcMode="spline"
  keyTimes="0;1"
  keySplines="0.22 1 0.36 1" />

  </path>
</svg>
     
   </button>
  </div>
  
  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/surah-engine.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
