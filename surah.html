<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surah</title>

  <base href="/wahyollah/">

  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var isNight = theme === "night";
        document.documentElement.classList.toggle("night-mode", isNight);

        var lang = localStorage.getItem("lang") || "ar";
        document.documentElement.setAttribute("data-lang", lang);
      } catch (e) {}
    })();
  </script>
  
  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-lang-root>

  <!-- HEADER -->
  
<header class="main-header">

  <!-- TOP BAR (controls only) -->
  <div class="header-bar">
    
   <div class="header-controls">
       <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="theme-icon" viewBox="0 0 30 29" aria-hidden="true">
    <circle class="theme-sun-center" cx="15" cy="14.5" r="5" />

    <g class="theme-ray theme-ray--top" transform="translate(15 5.2)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-right" transform="translate(21.6 7.9) rotate(45)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--right" transform="translate(24.3 14.5) rotate(90)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-right" transform="translate(21.6 21.1) rotate(135)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom" transform="translate(15 23.8) rotate(180)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--bottom-left" transform="translate(8.4 21.1) rotate(225)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--left" transform="translate(5.7 14.5) rotate(270)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>

    <g class="theme-ray theme-ray--top-left" transform="translate(8.4 7.9) rotate(315)">
      <rect class="theme-dot" x="-1.3" y="-1.3" width="2.6" height="2.6" rx="1.3" />
    </g>
  </svg>
</button>

<a href="index.html" class="home-toggle" aria-label="Home">
  <svg class="home-icon" viewBox="0 0 30 29" aria-hidden="true">
    <defs>
      <mask id="homeCutoutMask">
        <rect width="30" height="29" fill="white" />

        <path
          fill="black"
          transform="translate(15 14.5) scale(1.3) translate(-15 -13.8)"
          d="
            M10.25 9.95
            L13.2 7.72
            C14.25 6.92 15.75 6.92 16.8 7.72
            L19.75 9.95
            C20.57 10.57 21.04 11.55 21.04 12.58
            V17.94
            C21.04 19.11 20.09 20.06 18.92 20.06
            H17.14
            V16.36
            A2.14 2.14 0 0 0 12.86 16.36
            V20.06
            H11.08
            C9.91 20.06 8.96 19.11 8.96 17.94
            V12.58
            C8.96 11.55 9.43 10.57 10.25 9.95
            Z
          "
        />
      </mask>
    </defs>

    <path
      fill="currentColor"
      mask="url(#homeCutoutMask)"
      d="
        M11 0.5
        H19
        C25.3513 0.5 29.5 4.64873 29.5 11
        V18
        C29.5 24.3513 25.3513 28.5 19 28.5
        H11
        C4.64873 28.5 0.5 24.3513 0.5 18
        V11
        C0.5 4.64873 4.64873 0.5 11 0.5
        Z
      "
    />
  </svg>
</a>
     
   </div>

   <div id="nav-surah-title" class="nav-surah-title"></div>

    <div class="header-left">

      
      <div class="lang-switch">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>

    <div class="header-right">

     <button id="searchToggle" class="search-toggle" aria-label="Search" aria-expanded="false" type="button">
       <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
         <circle cx="11" cy="11" r="6.5"></circle>
         <path d="M16.2 16.2 L20 20"></path>
       </svg>
     </button>

      
     <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
       <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
         <!-- FULL X diagonals (the real full size) -->
         <path class="arm" pathLength="100" d="M6 8 L18 20" />
         <path class="arm" pathLength="100" d="M18 8 L6 20" />
       </svg>
     </button>
    </div>
  </div>

  <!-- MENU AREA (fills pill, not affected by header padding) -->
  <div id="menu-placeholder"></div>
  
  <div id="search-placeholder"></div>

  
</header>
  
  <!-- SURAH CONTENT -->
<main class="surah-container">
  <div id="surah-header"></div>
  <div id="quran-mode-switch"></div>
  <div id="surah-content"></div>
</main>


  

  <div class="surah-bottom-controls" aria-hidden="false">
    <div class="surah-bottom-left">
      <button
        id="leftUtilityBtn"
        class="left-utility-btn"
        type="button"
        aria-label="Left utility button"
      ></button>
    </div>


    
<div class="font-size-pill" id="fontSizePill" aria-label="Quran font size">
  <button
    id="fontSizeTrigger"
    class="font-size-trigger"
    type="button"
    aria-label="Open font size menu"
    aria-expanded="false"
  >
  <span class="font-size-trigger-large">ء</span>
</button>

  <div class="font-size-menu" aria-label="Choose Quran font size">
    <button class="font-size-btn font-size-btn--xs" type="button" data-font-size-option="xsmall">ء</button>
    <button class="font-size-btn font-size-btn--sm" type="button" data-font-size-option="small">ء</button>
    <button class="font-size-btn font-size-btn--md is-active" type="button" data-font-size-option="normal">ء</button>
    <button class="font-size-btn font-size-btn--lg" type="button" data-font-size-option="large">ء</button>
    <button class="font-size-btn font-size-btn--xl" type="button" data-font-size-option="xlarge">ء</button>
  </div>
</div>



    
    <div class="surah-bottom-pill">
      <button
        id="scrollToTopBtn"
        class="surah-bottom-pill-btn surah-bottom-pill-btn--top"
        type="button"
        aria-label="Scroll to top"
      >
<svg class="surah-bottom-pill-icon" viewBox="0 0 24 24" aria-hidden="true">
  <line x1="6" y1="6" x2="18" y2="6"></line>
  <line x1="12" y1="19" x2="12" y2="7"></line>
  <path d="M7.5 12 L12 7 L16.5 12"></path>
</svg>
      </button>

      <button
        id="scrollToBottomBtn"
        class="surah-bottom-pill-btn surah-bottom-pill-btn--bottom"
        type="button"
        aria-label="Scroll to bottom"
      >
  
<svg class="surah-bottom-pill-icon" viewBox="0 0 24 24" aria-hidden="true">
  <line x1="12" y1="5" x2="12" y2="17"></line>
  <path d="M7.5 12 L12 17 L16.5 12"></path>
  <line x1="6" y1="18" x2="18" y2="18"></line>
</svg>
        
      </button>
    </div>

    <div class="auto-scroll-bar">
      <button id="autoScrollBtn" class="auto-scroll-btn" type="button" aria-pressed="false" aria-label="Auto scroll">
<svg class="auto-icon" viewBox="0 0 24 24" aria-hidden="true">

  <!-- Dot that expands upward without stretching -->
<rect class="auto-dot"
      x="10.7"
      y="5.2"
      width="2.6"
      height="2.6"
      rx="1.3"
      fill="currentColor" />
  
  <!-- Top Chevron -->
  <path class="auto-chev auto-thin"
        d="M8.25 10 L12 13 L15.75 10" />

  <!-- Middle Chevron -->
  <path class="auto-chev auto-mid"
        d="M7 15 L12 19 L17 15" />

</svg>
      </button>
    </div>
  </div>
  
  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/surah-engine.js"></script>
  <script src="js/auto-scroll.js"></script>
  <script src="js/font-size-control.js"></script>
  <script src="js/arabic-normalizer.js"></script>
  <script src="js/search.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
